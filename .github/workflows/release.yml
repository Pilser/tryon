name: release

# The ONLY place that may run `cargo build --release`.
# Never build releases locally or on PR (see AGENTS.md §1, §3).
# Release-only: no check/test jobs here. Build cache is restored
# before the build and saved after, so the next run reuses it.
# Artifact is the Worker .wasm, downloaded for local `wrangler dev`.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-release
      - name: build worker wasm (capped for small runner)
        run: cargo build --release --target wasm32-unknown-unknown -p tryon-worker --jobs 2
      - name: upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryon-worker-${{ github.ref_name }}
          path: |
            target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: error
