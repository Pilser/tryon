<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Product - TryOn &amp; Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@400;600;700&display=swap"/></noscript>
<style>@view-transition{navigation:auto}</style><link rel="stylesheet" href="/app/dist/shell.css"/>
<style>/* loading skeleton (YouTube-style): static, pre-JS. Colors come from the shell.css token vars; the container metrics mirror the compiled rules (which override these once main.js maps them) */
.skc{background-color:var(--xegrvge);background-image:linear-gradient(100deg,rgba(244,247,228,0) 40%,rgba(244,247,228,.09) 50%,rgba(244,247,228,0) 60%);background-size:200% 100%;background-repeat:no-repeat;animation:skc-sweep 1.4s linear infinite}
@keyframes skc-sweep{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skc{animation:none}}
#detail{display:grid;gap:14px;max-width:1100px;margin-left:auto;margin-right:auto;padding:66px 14px 40px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){#detail{gap:18px;padding-left:26px;padding-right:26px;padding-top:78px}}
.skc-frame{display:block;width:100%;max-width:520px;aspect-ratio:3/4;border-radius:12px}
.skc-bar{display:block;height:16px;border-radius:8px}
.w60{width:62%}.w86{width:86%}.w38{width:38%}
.skc-btn{display:block;height:44px;border-radius:10px}
.skc-stack{display:grid;gap:10px;align-content:start;padding:14px 0}
</style>
<link rel="modulepreload" href="/app/dist/main.js"/>
</head>
<body data-page="product">
<header class="topbar"><a class="nav-back" href="/app/" aria-label="Back">&#8249;</a><a class="brand" href="/app/">TryOn &amp; Shop</a><a class="studio-link" href="/app/studio.html?owner=1" aria-label="Studio"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg></a></header>
<main class="page" id="detail"><div class="skc skc-frame"></div><div class="skc-stack"><span class="skc skc-bar w60"></span><span class="skc skc-bar w86"></span><span class="skc skc-bar w86"></span><span class="skc skc-bar w38"></span><span class="skc skc-btn"></span></div>
<section class="studio" id="studio">
  <h3 class="tl-head" id="st-tlhead" style="display:none">Your photos - tap to reuse</h3>
  <div id="st-timeline" class="tl-row" style="display:none"></div>
  <input id="pick-file" type="file" accept="image/*" hidden/>
  <input id="pick-cam" type="file" accept="image/*" capture="user" hidden/>
  <p id="st-meta" class="hint"></p>
  <p id="st-save" class="row" style="display:none"></p>
  <p id="st-welcome" class="hint ok" style="display:none"></p>
  <p id="st-err" class="error" style="display:none"></p>
  <div class="row">
    <a id="st-inquire" class="cta-ghost" target="_blank" rel="noopener" style="display:none"></a>
    <button id="st-start" class="cta" style="display:none">Try it on</button>
    <button id="st-edit" class="cta-ghost" type="button" style="display:none">Update</button>
  </div>
  <p id="st-prog" class="progress" style="display:none"></p>
  <div id="st-quota" class="quota" style="display:none"></div>
  <div id="st-res" style="display:none">
    <p id="st-cmp-cap" class="cmp-cap" style="display:none"></p>
    <div class="cmp-frame" id="st-cmp" style="display:none">
      <img id="st-cmp-base" class="cmp-base" alt="your original photo"/>
      <img id="st-cmp-top" class="cmp-top" alt="try-on result"/>
    </div>
    <img id="st-resimg" class="studio-result-img" alt="try-on result"/>
    <div class="row">
      <button id="st-dl" class="btn primary">Download image</button>
      <button id="st-retry" class="btn">Try again</button>
    </div>
    <p class="hint">Result links expire - download it now to keep it.</p>
  </div>
  <h3 class="tl-head" id="st-tlhead" style="display:none">Your timeline</h3>
  <div id="st-timeline" class="tl-row" style="display:none"></div>
</section>
<script type="module" src="/app/dist/main.js"></script>
</body>
</html>
