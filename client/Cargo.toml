[package]
name = "tryon-client"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_router = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlInputElement", "FormData", "File", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-net = "0.5"
gloo-file = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tryon-shared = { path = "../shared" }
