<style>/* loading skeleton (YouTube-style): static, pre-JS. Colors come from the shell.css token vars; the container metrics mirror the compiled rules (which override these once main.js maps them) */
.skc{background-color:var(--xegrvge);background-image:linear-gradient(100deg,rgba(244,247,228,0) 40%,rgba(244,247,228,.09) 50%,rgba(244,247,228,0) 60%);background-size:200% 100%;background-repeat:no-repeat;animation:skc-sweep 1.4s linear infinite}
@keyframes skc-sweep{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skc{animation:none}}
#grid{display:grid;gap:14px;width:100%;max-width:1100px;margin-left:auto;margin-right:auto;padding:14px 14px 40px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
@media (min-width:720px){#grid{gap:18px;padding-left:26px;padding-right:26px;padding-top:18px}}
.skc-card{border:1px solid var(--xegrvge);border-radius:14px;background:var(--x7s7ikk);overflow:hidden;padding-bottom:16px}
.skc-media{display:block;width:100%;aspect-ratio:3/4}
.skc-cap{display:block;margin:0;padding:8px 16px 0}
.skc-capbar{display:block;height:12px;border-radius:6px}
.skc-head{display:block;padding:2px 16px 0}
.skc-bar{display:block;height:16px;border-radius:8px}
.w60{width:62%}.w86{width:86%}.w38{width:38%}
.skc-price{display:block;margin:0;padding:4px 16px 0}
.skc-btn{display:block;margin:12px 16px 0;height:44px;border-radius:10px}
.skc-btn2{display:block;margin:8px 16px 0;height:44px;border-radius:10px;border:1px solid var(--xegrvge);background-color:transparent}
#detail{display:block;max-width:1100px;margin-left:auto;margin-right:auto;padding:66px 22px 40px}
.skc-frame{display:block;width:100%;aspect-ratio:3/4;border-radius:12px}
.skc-stack{display:grid;gap:10px;align-content:start;padding:14px 0}
</style>
<link rel="modulepreload" href="/app/dist/main.js"/>
</head>
