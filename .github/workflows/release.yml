name: release

# The ONLY place that may run `cargo build --release` or `bun run build`
# for shipped artifacts. Never build releases locally or on PR
# (see AGENTS.md §1, §3). Release-only: no check/test jobs here. Build
# cache is restored before the build and saved after.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-release
      - name: build worker wasm (capped for small runner)
        run: cargo build --release --target wasm32-unknown-unknown -p tryon-worker --jobs 2
      - name: wasm-bindgen glue for the local rig (prebuilt CLI, no compile)
        run: |
          curl -sL -o /tmp/wbg.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wbg.tar.gz -C /tmp
          /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            target/wasm32-unknown-unknown/release/tryon_worker.wasm \
            --out-dir .local-rig/glue-node --target nodejs --out-name tryon_worker
      - name: upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryon-worker-${{ github.ref_name }}
          path: |
            target/wasm32-unknown-unknown/release/*.wasm
            .local-rig/glue-node/tryon_worker.js
            .local-rig/glue-node/tryon_worker_bg.wasm
            .local-rig/glue-node/tryon_worker.d.ts
          if-no-files-found: error

  imgpipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-imgpipe
      - name: build imgpipe wasm (capped for small runner)
        run: cargo build --release --target wasm32-unknown-unknown -p tryon-imgpipe --jobs 2
      - name: wasm-bindgen glue (prebuilt CLI, no compile)
        run: |
          curl -sL -o /tmp/wbg.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wbg.tar.gz -C /tmp
          /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            target/wasm32-unknown-unknown/release/tryon_imgpipe.wasm \
            --out-dir frontend/dist/imgpipe --target web --out-name imgpipe
      - name: upload imgpipe artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryon-imgpipe-${{ github.ref_name }}
          path: |
            frontend/dist/imgpipe/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install (frozen lockfile)
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: frontend
        run: bun ./node_modules/typescript/bin/tsc --noEmit
      - name: build (esbuild + stylex)
        working-directory: frontend
        run: bun build.ts
      - name: upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryon-frontend-${{ github.ref_name }}
          path: |
            frontend/dist/*.js
            frontend/dist/*.js.map
            frontend/dist/stylex.css
            frontend/*.html
            frontend/_redirects
            frontend/_headers
          if-no-files-found: error

  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-platform
      # The platform control plane ships as wasm too: worker-build emits
      # the shim + module that wrangler deploys (never built locally).
      - name: build platform wasm (worker-build)
        working-directory: SaaSTryon/platform
        run: |
          # worker-build >= 0.7 refuses worker < 0.8.7; this repo pins
          # the worker crate at 0.5, so the 0.1.x line is the one that
          # builds it (it has no worker version gate).
          cargo install worker-build --version 0.1.14 --locked
          # The CLI must match the wasm-bindgen in Cargo.lock (0.2.129);
          # worker-build 0.1.14 would otherwise use its own 0.2.105.
          curl -sL -o /tmp/wbg.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wbg.tar.gz -C /tmp
          export WASM_BINDGEN_BIN=/tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen
          worker-build --release
      - uses: oven-sh/setup-bun@v2
      # The platform kit re-exports the root frontend's stylex styles, so
      # the root package must be installed for the types to resolve.
      - name: install root frontend deps (shared stylex styles)
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: install (frozen lockfile)
        working-directory: SaaSTryon/platform/frontend
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: SaaSTryon/platform/frontend
        run: bun ./node_modules/typescript/bin/tsc --noEmit
      - name: build (esbuild + stylex)
        working-directory: SaaSTryon/platform/frontend
        run: bun build.ts
      - name: upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryon-platform-${{ github.ref_name }}
          path: |
            SaaSTryon/platform/build/*
            SaaSTryon/platform/frontend/dist/*
          if-no-files-found: error


  # The shop bundle: built ONCE per release and stored in R2. Every
  # tenant shop is deployed by the platform from this bundle, so no shop
  # ever needs a local or per-shop CI build (PLATFORM.md §7.2).
  bundle:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-release
      - uses: oven-sh/setup-bun@v2
      - name: install (frozen lockfile)
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: frontend build (esbuild + stylex)
        working-directory: frontend
        run: bun build.ts
      - name: shop wasm (worker-build -> worker/build/index.js + index_bg.wasm)
        run: |
          cargo install worker-build --version 0.1.14 --locked
          curl -sL -o /tmp/wbg.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wbg.tar.gz -C /tmp
          export WASM_BINDGEN_BIN=/tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen
          # worker-build wants the package manifest, not the workspace
          # one, so it runs inside worker/ (the wrangler.toml rides along
          # for the name and the compatibility date).
          cp wrangler.toml worker/wrangler.toml
          cd worker
          worker-build --release
      - name: shop D1 schema (shop-schema.sql)
        run: |
          mkdir -p worker/build
          cargo run --release -p tryon-worker --bin ddl_dump > worker/build/shop-schema.sql
      # The imgpipe (HEIC -> jpg) belongs to the shop's frontend, so the
      # bundle carries it: frontend/dist/imgpipe/* is built here instead
      # of being copied from another job.
      - name: build imgpipe wasm (into the shop frontend)
        run: |
          cargo build --release --target wasm32-unknown-unknown -p tryon-imgpipe --jobs 2
          curl -sL -o /tmp/wbg.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wbg.tar.gz -C /tmp
          /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            target/wasm32-unknown-unknown/release/tryon_imgpipe.wasm \
            --out-dir frontend/dist/imgpipe --target web --out-name imgpipe
      - name: package the bundle
        run: bun scripts/package-bundle.ts "${{ github.ref_name }}"
      - name: upload the bundle to R2 (the platform deploys from here)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          set -e
          PREFIX="tryon-bundles/bundles/${{ github.ref_name }}"
          for f in manifest.json shop.wasm worker.js shop-schema.sql; do
            bunx wrangler@4 r2 object put "$PREFIX/$f" --file "bundle-out/$f" --remote
          done
          cd bundle-out/assets
          for f in $(find . -type f | sed 's|^\./||'); do
            bunx wrangler@4 r2 object put "$PREFIX/assets/$f" --file "$f" --remote
          done
      - name: upload bundle artifact (fallback copy)
        uses: actions/upload-artifact@v4
        with:
          name: tryon-bundle-${{ github.ref_name }}
          path: bundle-out/
          if-no-files-found: error

  # Optional: publish to Cloudflare when the repo has the secrets
  # (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). Skipped otherwise, so
  # artifact downloads keep working with no account wired up.
  deploy:
    needs: [worker, imgpipe]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "no Cloudflare secrets - artifact-only run"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ok == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.ok == 'true'
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        if: steps.creds.outputs.ok == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-worker-build
      - name: client build (served as static assets)
        if: steps.creds.outputs.ok == 'true'
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun build.ts
      - name: worker bundle (worker-build -> build/worker/shim.mjs)
        if: steps.creds.outputs.ok == 'true'
        run: |
          # worker-build >= 0.7 refuses worker < 0.8.7; this repo pins
          # the worker crate at 0.5, so the 0.1.x line is the one that
          # builds it (it has no worker version gate).
          cargo install worker-build --version 0.1.14 --locked
          # The CLI must match the wasm-bindgen in Cargo.lock (0.2.129);
          # worker-build 0.1.14 would otherwise use its own 0.2.105.
          curl -sL -o /tmp/wbg.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wbg.tar.gz -C /tmp
          export WASM_BINDGEN_BIN=/tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen
          worker-build --release
      - name: deploy
        if: steps.creds.outputs.ok == 'true'
        run: bunx wrangler@4 deploy
      # Workers assets are versioned, so a deploy already serves fresh
      # files; this purges the tagged bundle anyway (Cache-Tag rules in
      # frontend/_headers). Only runs when a zone id is configured.
      - name: purge cached bundle by tag
        if: steps.creds.outputs.ok == 'true' && env.CF_ZONE_ID != ''
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"tags":["tryon-shop-static"]}'
