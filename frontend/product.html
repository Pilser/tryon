<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Product — TryOn &amp; Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Poppins:wght@400;600;700&display=swap"/>
<link rel="stylesheet" href="/app/dist/stylex.css"/>
</head>
<body data-page="product">
<header class="topbar"><a class="brand" href="/app/">TryOn &amp; Shop</a><a class="admin-link" href="/app/admin.html">Admin</a></header>
<main id="detail"></main>
<section class="studio" id="studio">
  <h2>Virtual try-on</h2>
  <div class="studio-pick" id="studio-pick">
    <p>Select a clear front-facing photo, or take one now.</p>
    <div class="row">
      <label class="btn primary">Choose photo<input id="pick-file" type="file" accept="image/*" hidden/></label>
      <label class="btn secondary">Take photo<input id="pick-cam" type="file" accept="image/*" capture="user" hidden/></label>
    </div>
    <p class="hint">JPEG / PNG / WebP / HEIC · max 10 MB · hi-res auto-resized in your browser</p>
  </div>
  <img id="st-prev" class="studio-preview" style="display:none" alt="your photo"/>
  <p id="st-meta" class="hint"></p>
  <p id="st-welcome" class="hint ok" style="display:none"></p>
  <p id="st-err" class="error" style="display:none"></p>
  <div class="row">
    <button id="st-start" class="btn primary" style="display:none">Start try-on</button>
    <button id="st-change" class="btn" style="display:none">Change photo</button>
  </div>
  <p id="st-prog" class="progress" style="display:none"></p>
  <div id="st-res" style="display:none">
    <img id="st-resimg" class="studio-result-img" alt="try-on result"/>
    <div class="row">
      <button id="st-dl" class="btn primary">Download image</button>
      <button id="st-retry" class="btn">Try again</button>
    </div>
    <p class="hint">Result links expire — download it now to keep it.</p>
  </div>
  <h3 class="tl-head" id="st-tlhead" style="display:none">Your timeline</h3>
  <div id="st-timeline" class="tl-row" style="display:none"></div>
</section>
<script src="/app/dist/bundle.js"></script>
</body>
</html>
