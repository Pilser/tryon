name = "tryon-shop"
main = "build/worker/shim.mjs"
compatibility_date = "2026-01-01"

[vars]
SHOP_NAME = "TryOn & Shop"
SHOP_CURRENCY = "UGX"
R2_PUBLIC_BASE = ""

# Phase F tenant wiring (set by the SaaSTryon deployer via script-PUT
# metadata when this shop runs on the platform; absent = plain shop):
#   SHOP_ID         namespaces every R2 key under `shops/<id>/…`
#   PLATFORM_TOKEN  Bearer for the platform API (token redeem, metered
#                   Genlook proxy). The deployer binds it as a secret.
#   GENLOOK_PROXY   optional service binding to the outbound proxy; the
#                   HTTP path (PLATFORM_URL) is the fallback used today.
# Plain shops never see these and keep calling Genlook directly.

# Secrets (set via `wrangler secret put`): GENLOOK_API_KEY, OWNER_TOKEN, OWNER_WHATSAPP
# SHOP_CURRENCY is the shop default for new bundles (dropdown in the studio);
# any code from shared/src/currency.rs, UGX when unset.
# R2_PUBLIC_BASE (vars): public base URL serving the bucket, e.g.
# `https://pub-<hash>.r2.dev` or a custom domain (no trailing slash).
# D1: create with `wrangler d1 create tryon-db`, then paste its id below.
[[r2_buckets]]
binding = "PRODUCTS"
bucket_name = "tryon-products"

[[d1_databases]]
binding = "DB"
database_name = "tryon-db"
database_id = "replace-me"

[build]
command = "cargo install worker-build && worker-build --release"

# The client app is static: Workers serve frontend/ straight from the edge
# (`/app/*` -> frontend/<file> via frontend/_redirects) without invoking the
# Worker, so pages and bundles are cached and cost no request. The Worker
# keeps /, /product/:id, /studio, /healthz and /api/* to itself.
# Needs wrangler >= 4 (array form of run_worker_first).
[assets]
directory = "./frontend"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/", "/product/*", "/studio", "/healthz", "/api/*"]
