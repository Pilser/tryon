name: release

# The ONLY place that may run `cargo build --release` or `bun run build`
# for shipped artifacts. Never build releases locally or on PR
# (see AGENTS.md §1, §3). Release-only: no check/test jobs here. Build
# cache is restored before the build and saved after.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-release
      - name: build worker wasm (capped for small runner)
        run: cargo build --release --target wasm32-unknown-unknown -p tryon-worker --jobs 2
      - name: wasm-bindgen glue for the local rig (prebuilt CLI, no compile)
        run: |
          curl -sL -o /tmp/wbg.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wbg.tar.gz -C /tmp
          /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            target/wasm32-unknown-unknown/release/tryon_worker.wasm \
            --out-dir .local-rig/glue-node --target nodejs --out-name tryon_worker
      - name: upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryon-worker-${{ github.ref_name }}
          path: |
            target/wasm32-unknown-unknown/release/*.wasm
            .local-rig/glue-node/tryon_worker.js
            .local-rig/glue-node/tryon_worker_bg.wasm
            .local-rig/glue-node/tryon_worker.d.ts
          if-no-files-found: error

  imgpipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-imgpipe
      - name: build imgpipe wasm (capped for small runner)
        run: cargo build --release --target wasm32-unknown-unknown -p tryon-imgpipe --jobs 2
      - name: wasm-bindgen glue (prebuilt CLI, no compile)
        run: |
          curl -sL -o /tmp/wbg.tar.gz https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/wbg.tar.gz -C /tmp
          /tmp/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen \
            target/wasm32-unknown-unknown/release/tryon_imgpipe.wasm \
            --out-dir frontend/dist/imgpipe --target web --out-name imgpipe
      - name: upload imgpipe artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryon-imgpipe-${{ github.ref_name }}
          path: |
            frontend/dist/imgpipe/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: install (frozen lockfile)
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: typecheck
        working-directory: frontend
        run: bun ./node_modules/typescript/bin/tsc --noEmit
      - name: build (esbuild + stylex)
        working-directory: frontend
        run: bun build.ts
      - name: upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: tryon-frontend-${{ github.ref_name }}
          path: |
            frontend/dist/*.js
            frontend/dist/*.js.map
            frontend/dist/stylex.css
            frontend/*.html
            frontend/_redirects
            frontend/_headers
          if-no-files-found: error

  # Optional: publish to Cloudflare when the repo has the secrets
  # (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID). Skipped otherwise, so
  # artifact downloads keep working with no account wired up.
  deploy:
    needs: [worker, imgpipe]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "no Cloudflare secrets - artifact-only run"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.creds.outputs.ok == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.creds.outputs.ok == 'true'
        with:
          targets: wasm32-unknown-unknown
      - name: restore build cache
        if: steps.creds.outputs.ok == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tryon-worker-build
      - name: client build (served as static assets)
        if: steps.creds.outputs.ok == 'true'
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun build.ts
      - name: worker bundle (worker-build -> build/worker/shim.mjs)
        if: steps.creds.outputs.ok == 'true'
        run: |
          cargo install worker-build --locked
          worker-build --release
      - name: deploy
        if: steps.creds.outputs.ok == 'true'
        run: bunx wrangler@4 deploy
      # Workers assets are versioned, so a deploy already serves fresh
      # files; this purges the tagged bundle anyway (Cache-Tag rules in
      # frontend/_headers). Only runs when a zone id is configured.
      - name: purge cached bundle by tag
        if: steps.creds.outputs.ok == 'true' && env.CF_ZONE_ID != ''
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"tags":["tryon-shop-static"]}'
